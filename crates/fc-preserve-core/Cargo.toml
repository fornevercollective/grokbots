[package]
name = "fc-preserve-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform walk + sit for the FC-Preserve device tree. No AppKit."

[features]
default = ["watch"]
watch = ["dep:notify"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = { version = "6.1", optional = true }
